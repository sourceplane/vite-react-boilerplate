# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (VR → VR-1, VR-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: vite-react-boilerplate
  key: VR
spec:
  title: "Vercel's Vite - React template on Cloudflare Workers"
  summary: "Vercel's Vite and React example — create-vite's React and TypeScript welcome page: the Vite and React logos linking to their docs, the heading, the counter and the HMR hint — on the template's own Vite 5 and React 18, built fully static and served as Cloudflare Workers Static Assets behind one small Worker as a single-page app, with a Vitest spec of the page the template never had, inside the Cirrus baseline's repository conventions, and becomes an Orun baseline that takes a new Vite and React app from nothing to live on stage and prod in one landing."
  state: started
  milestones:
    - name: "VR0 — the spec"
      exitCriteria:
        - "the repository is born with its intent, CI, tooling and spec index, and this doc set and the task contracts are on main"
      tasks: [VR-1]
    - name: "VR1 — the app on Workers"
      exitCriteria:
        - "apps/web is the upstream template on its Vite 5 and React 18, built static by tsc -b and vite build, with one Worker in front of dist as Workers Static Assets"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` (the page's Vitest spec, and tests/web) and `pnpm build` are green"
        - "`wrangler dev` serves the shell, its bundle, stylesheet and logos, answers every page address with the app and a missing file with a 404"
        - "the README says how to run, test, preview and deploy it, and how every Vercel piece maps to Cloudflare"
      tasks: [VR-2]
    - name: "VR2 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new Vite and React app from nothing to live on stage and prod in one landing, then record it"
        - "an app built from it carries the app only, renamed throughout to its own name, repository and Worker, with the framework's own names intact"
        - "Baseline CI is green: contract tests, generated component docs, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier"
      tasks: [VR-3]
